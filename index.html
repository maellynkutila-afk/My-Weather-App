<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://unpkg.com/axios@1.13.2/dist/axios.min.js"></script>
    <link rel="stylesheet" href="src/style.css" />
    <title>Weather App</title>
  </head>
  <body>
    <h1>Welcome 👋🏼</h1>
    <h2>Tuesday September 15 2026</h2>
    <div class="container">
      <div class="cityAndInfo">
        <h3>Paris</h3>
        <p>
          Few clouds <br />
          Humidity: 76%, Wind: 4.63km/h
        </p>
      </div>
      <div class="currentTemperature">
        <span class="weatherLogo">☀️</span
        ><span class="temperatureNumber" id="temperatureNumber">12</span
        ><span class="celsius">°C</span>
      </div>
      <hr />
      <form class="weather-form" id="weather-form">
        <input
          type="text"
          placeholder="Enter a city..."
          required
          class="enteredCity"
          id="entered-city"
        />
        <input
          type="submit"
          value="Search"
          class="submitButton"
          id="submitButton"
        />
      </form>
    </div>
    <footer>
      This project was coded by
      <a href="https://github.com/maellynkutila-afk" target="_blank">
        Maelly Barbier</a
      >, is
      <a
        href="https://github.com/maellynkutila-afk/My-Weather-App"
        target="_blank"
      >
        open-sourced on GitHub</a
      >
      and website hosted
      <a href="https://shecodesweatherappproject1.netlify.app/" target="_blank"
        >on Netlify</a
      >
    </footer>
    <script src="src/index.js"></script>
  </body>
</html>
